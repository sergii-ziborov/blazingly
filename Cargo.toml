[workspace]
members = [
    "crates/cargo-blazingly",
    "crates/blazingly",
    "crates/blazingly-contract",
    "crates/blazingly-core",
    "crates/blazingly-database",
    "crates/blazingly-deploy",
    "crates/blazingly-docs",
    "crates/blazingly-di",
    "crates/blazingly-executor",
    "crates/blazingly-http",
    "crates/blazingly-macros",
    "crates/blazingly-middleware",
    "crates/blazingly-mcp",
    "crates/blazingly-mcp-stdio",
    "crates/blazingly-native",
    "crates/blazingly-observability",
    "crates/blazingly-openapi",
    "crates/blazingly-queue",
    "crates/blazingly-realtime",
    "crates/blazingly-security",
    "crates/blazingly-templates",
    "crates/blazingly-validation",
    "crates/blazingly-wire",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/sergii-ziborov/blazingly"
readme = "README.md"
keywords = ["framework", "http", "api", "openapi", "mcp"]
categories = [
    "web-programming::http-server",
    "web-programming",
    "api-bindings",
    "asynchronous",
    "development-tools",
]
# The release gate (docs/stability.md, "Release process") was walked step by
# step before this flipped: CI `test`, `security-audit`, `miri`,
# `address-sanitizer`, `fuzz-smoke`, `contract-semver`,
# `feature-combinations`, and `rustdoc` green on the release commit;
# `workspace-semver` reviewed (advisory, no baseline before the first
# release); submodules pinned to released tags satisfying the
# [workspace.dependencies] requirements; CHANGELOG.md section promoted.
publish = true

[workspace.dependencies]
blazingly-contract = { version = "0.3.0", path = "crates/blazingly-contract" }
blazingly-core = { version = "0.1.0", path = "crates/blazingly-core" }
blazingly-database = { version = "0.1.0", path = "crates/blazingly-database" }
blazingly-deploy = { version = "0.1.0", path = "crates/blazingly-deploy" }
blazingly-docs = { version = "0.1.0", path = "crates/blazingly-docs" }
blazingly-di = { version = "0.1.0", path = "crates/blazingly-di" }
blazingly-executor = { version = "0.1.0", path = "crates/blazingly-executor" }
blazingly-http = { version = "0.1.0", path = "crates/blazingly-http" }
blazingly-json = { version = "0.1.0", path = "crates/blazingly-json" }
blazingly-macros = { version = "0.1.0", path = "crates/blazingly-macros" }
blazingly-middleware = { version = "0.1.0", path = "crates/blazingly-middleware" }
blazingly-mcp = { version = "0.1.0", path = "crates/blazingly-mcp" }
blazingly-mcp-stdio = { version = "0.1.0", path = "crates/blazingly-mcp-stdio" }
blazingly-native = { version = "0.1.0", path = "crates/blazingly-native" }
blazingly-observability = { version = "0.1.0", path = "crates/blazingly-observability" }
blazingly-openapi = { version = "0.1.0", path = "crates/blazingly-openapi" }
blazingly-queue = { version = "0.1.0", path = "crates/blazingly-queue" }
blazingly-realtime = { version = "0.1.0", path = "crates/blazingly-realtime" }
blazingly-security = { version = "0.1.0", path = "crates/blazingly-security" }
blazingly-templates = { version = "0.1.0", path = "crates/blazingly-templates" }
blazingly-validation = { version = "0.1.0", path = "crates/blazingly-validation" }
blazingly-wire = { version = "0.1.0", path = "crates/blazingly-wire" }
base64 = "0.22"
brotli = "8"
compio = { version = "0.17.0", default-features = false, features = [
    "io-compat",
    "io-uring",
    "dispatcher",
    "polling",
    "runtime",
    "signal",
    "time",
] }
ctrlc = { version = "3.5.0", features = ["termination"] }
futures-lite = "2"
futures-util = "0.3"
flate2 = "1"
hmac = "0.12"
httparse = "1.10"
httpdate = "1.0.3"
# SIMD substring search for the streaming multipart boundary scanner. Already
# in the dependency graph transitively; used directly where a scalar byte loop
# was the dominant per-byte cost of large uploads.
memchr = "2"
minijinja = "2.21"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
rust_decimal = "1"
proc-macro2 = "1"
quote = "1"
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
# Dev-only. The framework encodes and decodes with `blazingly-json`; this is the
# independent oracle `crates/blazingly/tests/json_oracle.rs` checks the wire
# bytes against, so a shared bug in one engine cannot pass unnoticed. It must
# never appear in a `[dependencies]` table.
serde_json = "1.0.151"
serde_path_to_error = "0.1"
sha2 = "0.10"
sha1 = "0.10"
shiguredo_http2 = "=2026.1.0-canary.6"
syn = { version = "3.0.3", features = ["full", "parsing", "printing"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
