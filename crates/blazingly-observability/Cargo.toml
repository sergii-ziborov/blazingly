[package]
name = "blazingly-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Request identity, access events, tracing and OpenTelemetry propagation, and Prometheus metrics for Blazingly"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# Without this, docs.rs documents default features only, and every optional
# surface is missing from the rendered page: for the facade that is the
# native server itself. The workspace rustdoc job already builds all
# features under -D warnings, so this asks docs.rs for what CI proves.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
# OTLP/HTTP span export. Every crate below resolves without Tokio: the SDK batch
# processor runs on its own thread and blocks on the export future through
# `futures_executor`, and `opentelemetry-otlp` is taken without its
# `reqwest-*`/`hyper-client`/`grpc-tonic` transports, which are the only paths
# that would pull an async runtime in.
otel = [
    "dep:async-trait",
    "dep:http",
    "dep:opentelemetry",
    "dep:opentelemetry-http",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[dependencies]
async-trait = { version = "0.1", optional = true }
blazingly-core.workspace = true
blazingly-http.workspace = true
# The type language of `opentelemetry_http::HttpClient`; already in that crate's
# tree, declared here so the transport can name `Uri` and `HeaderMap`.
http = { version = "1", default-features = false, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-http = { version = "0.32", default-features = false, optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "http-proto",
    "trace",
], optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = [
    "trace",
], optional = true }
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "registry",
    "std",
], optional = true }
uuid.workspace = true

# Process metrics. `unsafe_code` is forbidden workspace-wide, so the Windows
# process APIs and macOS Mach/clock APIs live behind these safe wrappers instead
# of direct FFI in Blazingly. Neither dependency pulls in an async runtime.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpu-time = "1"
memory-stats = "1"

[lints]
workspace = true
