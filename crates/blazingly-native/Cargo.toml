[package]
name = "blazingly-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native Compio HTTP/1 adapter for Blazingly, with optional rustls TLS and an experimental HTTP/2 path"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# Without this, docs.rs documents default features only, and every optional
# surface is missing from the rendered page: for the facade that is the
# native server itself. The workspace rustdoc job already builds all
# features under -D warnings, so this asks docs.rs for what CI proves.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
http2 = ["dep:shiguredo_http2"]
tls = ["compio/ring", "compio/rustls"]

[dependencies]
blazingly-core.workspace = true
blazingly-executor.workspace = true
blazingly-http.workspace = true
blazingly-openapi.workspace = true
blazingly-wire.workspace = true
compio.workspace = true
ctrlc.workspace = true
futures-lite.workspace = true
futures-util.workspace = true
httpdate.workspace = true
shiguredo_http2 = { workspace = true, optional = true }
thread-priority.workspace = true

[lints]
workspace = true
