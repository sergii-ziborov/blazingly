[package]
name = "cargo-blazingly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Development and production CLI for Blazingly applications"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
# Not the workspace list: this crate is a cargo subcommand, not a server
# library, and the inherited categories left it out of the two lists a
# developer actually browses to find `cargo blazingly new`.
categories = [
    "development-tools::cargo-plugins",
    "command-line-utilities",
    "development-tools",
    "web-programming",
]
publish.workspace = true

[dependencies]
blazingly-docs.workspace = true
blazingly-json.workspace = true
ctrlc.workspace = true
serde = { workspace = true, features = ["std"] }
toml.workspace = true

[lints]
workspace = true

# Without this, docs.rs documents default features only, and every optional
# surface is missing from the rendered page: for the facade that is the
# native server itself. The workspace rustdoc job already builds all
# features under -D warnings, so this asks docs.rs for what CI proves.
[package.metadata.docs.rs]
all-features = true
