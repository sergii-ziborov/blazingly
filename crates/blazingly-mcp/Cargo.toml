[package]
name = "blazingly-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Runtime-neutral MCP server for Blazingly operations: JSON-RPC lifecycle, Streamable HTTP, resources, and prompts"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# Without this, docs.rs documents default features only, and every optional
# surface is missing from the rendered page: for the facade that is the
# native server itself. The workspace rustdoc job already builds all
# features under -D warnings, so this asks docs.rs for what CI proves.
[package.metadata.docs.rs]
all-features = true

[features]
validation = ["dep:blazingly-validation"]

[dependencies]
blazingly-validation = { workspace = true, optional = true }
blazingly-core.workspace = true
blazingly-executor.workspace = true
blazingly-json.workspace = true
serde = { workspace = true, features = ["std"] }

[dev-dependencies]
# The README example is this crate's rustdoc header, so it runs as a doctest;
# it needs some executor to drive the returned future, and this crate
# deliberately ships none.
futures-lite.workspace = true

[lints]
workspace = true
